model: ncf
seed: 42
wandb:
  enabled: false
  project: ncf-deepconn-experiment

data:
  dir: data/processed/amazon
  dataset: amazon
  train_file: train_ratings.parquet
  val_file: val_ratings.parquet
  test_file: test_ratings.parquet

model_params:
  gmf_dim: 32
  mlp_dims: [64, 32, 16]
  dropout: 0.1

evaluation:
  k: 10
  negatives_per_positive: 99
  batch_users: 256
  negatives_file: data/processed/test_negatives.pkl

training:
  epochs: 15
  batch_size: 256
  lr: 0.00035927
  weight_decay: 1.3737e-7
  patience: 3
  num_workers: 0
  checkpoint: best_ncf.pt
  device: auto   # auto | cpu | cuda
